[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "jev-codex-router"
version = "0.1.0"
description = "Persistent OpenRouter Jev routing sidecar for Codex"
requires-python = ">=3.10"
dependencies = ["httpx>=0.27,<1"]

[project.scripts]
jev-codex-router = "jev_codex_router.server:run"
jev-codex-router-benchmark = "jev_codex_router.benchmark:run"
jev-codex-router-e2e = "jev_codex_router.e2e_benchmark:run"

[tool.hatch.build.targets.wheel]
packages = ["jev_codex_router"]

[tool.hatch.build.targets.wheel.force-include]
"examples/e2e" = "jev_codex_router/bundled_e2e"
